[project]
name = "margin-compass-infra"
version = "0.1.0"
description = "Margin Compass infrastructure as code (AWS CDK v2, Python). ADR-005."
requires-python = ">=3.12,<3.14"
dependencies = [
    "aws-cdk-lib==2.275.0",
    "constructs>=10.0.0,<11.0.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

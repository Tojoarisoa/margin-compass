[project]
name = "mc-pipelines"
version = "0.1.0"
description = "Margin Compass data pipeline: ingest (landing -> bronze), dbt-duckdb transform (silver, gold)."
requires-python = ">=3.12,<3.14"
dependencies = [
    "duckdb>=1.1",
    "dbt-core>=1.9",
    "dbt-duckdb>=1.9",
    "pyarrow>=17.0",
]

[project.scripts]
mc-pipeline = "mc_pipelines.cli:main"

[dependency-groups]
dev = ["pytest>=8", "booncore-simulator"]

[tool.uv.sources]
booncore-simulator = { path = "../simulator", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mc_pipelines"]

[tool.pytest.ini_options]
testpaths = ["tests"]

name: margin_compass
version: "0.1.0"
config-version: 2
profile: margin_compass

flags:
  send_anonymous_usage_stats: false  # no usage telemetry to dbt Labs

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "../../data/local/dbt/target"
log-path: "../../data/local/dbt/logs"

vars:
  # Set by the runner (mc-pipeline); defaults let `dbt parse` work standalone.
  bronze_path: "../../data/local/bronze"
  silver_path: "../../data/local/silver"
  gold_path: "../../data/local/gold"
  ingest_date: "1970-01-01"
  window_start: "2025-08-01"
  window_end: "2025-10-29"
  feature_scope: "F1 only (M1)"
  run_id: "unset"

models:
  margin_compass:
    staging:
      +materialized: view
    silver:
      +materialized: external
      +format: parquet
    gold:
      +materialized: external
      +format: parquet

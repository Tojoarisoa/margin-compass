[project]
name = "mc-ml"
version = "0.1.0"
description = "Margin Compass models and model registry (PLAN.md §6.2 Stage 4)."
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.0",
    "pyarrow>=17.0",
    "boto3>=1.35",
]

[dependency-groups]
dev = ["pytest>=8", "moto[dynamodb]>=5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mc_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

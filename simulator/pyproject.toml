[project]
name = "booncore-simulator"
version = "0.1.0"
description = "Synthetic BoonCore data with labeled ground truth (docs/booncore-spec.md). All output is synthetic."
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.0",
    "pyarrow>=17.0",
]

[project.scripts]
booncore-sim = "booncore_sim.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["booncore_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project]
name = "mc-agents"
version = "0.1.0"
description = "Margin Compass agents (PLAN.md §8). M1-06: one-node Cost-to-Serve Analyst (AG-03) with replay evaluation."
requires-python = ">=3.12,<3.14"
dependencies = [
    "langgraph==1.2.19",  # ADR-010: pinned to an exact version
    "duckdb>=1.1",
    "boto3>=1.40",
    "pyyaml>=6",  # metric registry (mc_pipelines.metrics), used by the kpi tool
    "mc-rag",  # retrieval tool (M4-02)
]

[project.scripts]
mc-agents = "mc_agents.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "mc-pipelines",
    "booncore-simulator",
    "moto[dynamodb]>=5",
]

[tool.uv.sources]
mc-pipelines = { path = "../pipelines", editable = true }
mc-rag = { path = "../rag", editable = true }
booncore-simulator = { path = "../simulator", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mc_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]

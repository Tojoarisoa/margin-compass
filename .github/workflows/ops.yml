# Ops (autopilot, AGENTS.md §8): AWS actions for unattended Claude Code cloud sessions, which hold
# no AWS credentials. Dispatched on main only; the OIDC ops role can run and observe, not deploy.
# Live model calls are capped in code (8 calls and $0.01 per question; the cost gate covers infra).
name: ops

on:
  workflow_dispatch:
    inputs:
      task:
        description: What to do
        required: true
        type: choice
        options: [status, cost-report, run-pipeline, start-nightly, start-backfill, verify-backfill, record-fixtures, live-eval, rag-eval]
      model:
        description: Agent model for record-fixtures / live-eval (agents/mc_agents/config.py)
        required: false
        default: haiku-4-5
        type: choice
        options: [haiku-4-5, haiku-5-5]
      cache:
        description: Turn on Bedrock prompt caching (MC_CACHE_PROMPT=1) for record-fixtures / live-eval (M4-04)
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: ops
  cancel-in-progress: false

env:
  UV_VERSION: "0.11.16"
  PYTHON_VERSION: "3.13"
  AWS_REGION: us-east-1

jobs:
  ops:
    if: github.ref == 'refs/heads/main' && vars.MC_AWS_ENABLED == 'true'  # account values are secrets (masked in public logs)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_OPS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gh-ops-${{ github.run_id }}
          mask-aws-account-id: true

      - name: status
        if: inputs.task == 'status'
        run: |
          set -euo pipefail
          {
            echo "## Status"
            for st in mc-shared-foundation mc-dev-state mc-dev-data mc-dev-web; do
              echo "- $st: $(aws cloudformation describe-stacks --stack-name "$st" --query 'Stacks[0].StackStatus' --output text)"
            done
            url="$(aws cloudformation describe-stacks --stack-name mc-dev-web --query "Stacks[0].Outputs[?OutputKey=='Url'].OutputValue" --output text)"
            for p in / /publish/latest/pg1.json /api/health; do echo "- $p → $(curl -s -o /dev/null -w '%{http_code}' "$url$p")"; done
            sm="$(aws cloudformation describe-stacks --stack-name mc-dev-data --query "Stacks[0].Outputs[?OutputKey=='NightlyStateMachine'].OutputValue" --output text)"
            echo "- nightly runs: $(aws stepfunctions list-executions --state-machine-arn "$sm" --max-results 5 --query 'executions[].[name,status]' --output text | tr '\t\n' ' ;')"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: cost-report
        if: inputs.task == 'cost-report'
        run: python3 infra/scripts/ops/cost_report.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: run-pipeline
        if: inputs.task == 'run-pipeline'
        run: |
          set -euo pipefail
          aws lambda invoke --function-name mc-dev-data-pipeline --cli-read-timeout 900 \
            --payload "{\"run_id\":\"ops-${GITHUB_RUN_ID}\"}" --cli-binary-format raw-in-base64-out out.json --query FunctionError --output text
          { echo "## Pipeline run"; echo '```json'; cat out.json; echo; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          python3 -c "import json,sys; sys.exit(0 if json.load(open('out.json')).get('status')=='success' else 1)"

      - name: start-nightly
        if: inputs.task == 'start-nightly'
        run: |
          set -euo pipefail
          sm="$(aws cloudformation describe-stacks --stack-name mc-dev-data --query "Stacks[0].Outputs[?OutputKey=='NightlyStateMachine'].OutputValue" --output text)"
          ex="$(aws stepfunctions start-execution --state-machine-arn "$sm" --name "ops-${GITHUB_RUN_ID}" --query executionArn --output text)"
          for _ in $(seq 1 60); do st="$(aws stepfunctions describe-execution --execution-arn "$ex" --query status --output text)"; [[ "$st" != RUNNING ]] && break; sleep 15; done
          echo "## Nightly execution: $st" >> "$GITHUB_STEP_SUMMARY"
          [[ "$st" == SUCCEEDED ]]

      - name: start-backfill
        if: inputs.task == 'start-backfill'
        run: |
          set -euo pipefail
          sm="$(aws cloudformation describe-stacks --stack-name mc-dev-data --query "Stacks[0].Outputs[?OutputKey=='BackfillStateMachine'].OutputValue" --output text)"
          ex="$(aws stepfunctions start-execution --state-machine-arn "$sm" --name "ops-${GITHUB_RUN_ID}" --query executionArn --output text)"
          for _ in $(seq 1 100); do st="$(aws stepfunctions describe-execution --execution-arn "$ex" --query status --output text)"; [[ "$st" != RUNNING ]] && break; sleep 15; done
          { echo "## Backfill execution: $st"; echo "$ex"; echo '```json'; aws stepfunctions describe-execution --execution-arn "$ex" --query output --output text | head -c 6000; echo; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
          [[ "$st" == SUCCEEDED ]]

      - name: verify-backfill
        if: inputs.task == 'verify-backfill'
        run: |
          set -euo pipefail
          sm="$(aws cloudformation describe-stacks --stack-name mc-dev-data --query "Stacks[0].Outputs[?OutputKey=='BackfillStateMachine'].OutputValue" --output text)"
          ex="$(aws stepfunctions list-executions --state-machine-arn "$sm" --status-filter SUCCEEDED --max-results 1 --query 'executions[0].executionArn' --output text)"
          aws stepfunctions describe-execution --execution-arn "$ex" --query '{name:name,start:startDate,stop:stopDate,output:output}' --output json > exec.json
          start_ms="$(python3 -c "import json,datetime as d; print(int(d.datetime.fromisoformat(json.load(open('exec.json'))['start']).timestamp()*1000))")"
          aws logs filter-log-events --log-group-name /aws/lambda/mc-dev-data-pipeline --start-time "$start_ms" \
            --filter-pattern '"Max Memory Used"' --query 'events[].message' --output text > report.txt || true
          url="$(aws cloudformation describe-stacks --stack-name mc-dev-web --query "Stacks[0].Outputs[?OutputKey=='Url'].OutputValue" --output text)"
          curl -s "$url/publish/latest/runs.json" > runs.json || true
          {
            echo "## Backfill check"
            echo '```json'; cat exec.json; echo; echo '```'
            echo "Lambda REPORT lines (memory size / max used):"; echo '```'; grep -o 'Memory Size: [0-9]* MB.*Max Memory Used: [0-9]* MB' report.txt | sort | uniq -c || true; echo '```'
            echo "runs.json:"; echo '```json'; head -c 1500 runs.json; echo; echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: verify-backfill (row counts)
        if: inputs.task == 'verify-backfill'
        run: |
          set -euo pipefail
          bucket="$(aws cloudformation describe-stacks --stack-name mc-dev-data --query "Stacks[0].Outputs[?OutputKey=='LakeBucket'].OutputValue" --output text)"
          mkdir -p lake
          aws s3 sync "s3://$bucket/gold" lake/gold --only-show-errors
          aws s3 sync "s3://$bucket/silver" lake/silver --only-show-errors
          python3 -m venv .venv-counts && .venv-counts/bin/pip install -q duckdb
          st=0; .venv-counts/bin/python infra/scripts/ops/lake_counts.py lake > counts.txt || st=$?
          { echo "## Lake row counts (silver and gold)"; echo '```'; cat counts.txt; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
          url="$(aws cloudformation describe-stacks --stack-name mc-dev-web --query "Stacks[0].Outputs[?OutputKey=='Url'].OutputValue" --output text)"
          { echo "## Published quality gates (EV-03, EV-11)"; echo '```json'; curl -s "$url/publish/latest/quality.json" | head -c 3000; echo; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
          { echo "## Daily cost by feature (gold fct_unit_cost)"; echo '```'; for f in F0 F1 F2 F3 F4; do echo "# $f"; .venv-counts/bin/python infra/scripts/ops/dump_series.py lake $f || true; done; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
          mkdir -p lake/models
          aws s3 sync "s3://$bucket/models" lake/models --only-show-errors || true
          { echo "## Forecaster EV-02 (models/*/backtest.json)"; echo '```'
            for f in $(find lake/models -name backtest.json | sort | tail -3); do echo "$f"; python3 -c "import json,sys; d=json.load(open(sys.argv[1])); e=d.get('ev02') or {}; print(json.dumps({'wape': d.get('wape'), 'passed': e.get('passed'), 'features_scored': e.get('features_scored')})); print('\n'.join(e.get('failures', [])[:40])); [print(k, {m: {x: (y or {}).get('wape') for x, y in v.items()} for m in ['wape']} if v else None) for k, v in sorted((d.get('multi_step') or {}).items())]" "$f"; done
            echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
          { echo "## Published FinOps (PG-8, finops.json)"; echo '```json'; curl -s "$url/publish/latest/finops.json" | head -c 2000; echo; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
          { echo "## Published margin brief (M5-01, margin_brief.json)"; echo '```json'; curl -s "$url/publish/latest/margin_brief.json" | head -c 3000; echo; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$st"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: inputs.task == 'record-fixtures' || inputs.task == 'live-eval' || inputs.task == 'rag-eval'
        with: { version: "${{ env.UV_VERSION }}", python-version: "${{ env.PYTHON_VERSION }}" }
      - name: record-fixtures / live-eval (live Bedrock, capped per question)
        if: inputs.task == 'record-fixtures' || inputs.task == 'live-eval'
        working-directory: agents
        env:
          MODEL: ${{ inputs.model }}
          MC_CACHE_PROMPT: ${{ inputs.cache && '1' || '0' }}
          MODE: ${{ inputs.task == 'record-fixtures' && 'record' || 'live' }}
        run: |
          set -euo pipefail
          uv sync --frozen
          uv run python - <<'PY'
          from pathlib import Path
          from booncore_sim.cli import run as simulate
          from mc_pipelines.cli import main
          root = Path("../data/ops")
          simulate("m1", 42, root / "landing" / "booncore", run_id="ops")
          raise SystemExit(main(["run", "--landing", str(root / "landing" / "booncore"), "--data-root", str(root), "--ingest-date", "2026-11-04"]))
          PY
          line="$(uv run mc-agents --gold ../data/ops/gold --model "$MODEL" eval --mode "$MODE" --out ../data/ops/report.json)" || status=$?
          { echo "## Agent eval ($MODE, $MODEL)"; echo "$line"; } >> "$GITHUB_STEP_SUMMARY"
          exit "${status:-0}"
      - name: rag-eval (EV-04 with Titan embeddings; budget-capped in code)
        if: inputs.task == 'rag-eval'
        working-directory: rag
        run: |
          set -euo pipefail
          uv sync --frozen
          uv run mc-rag index --embedder titan --store ../data/ops/rag-index.json
          st=0; line="$(uv run mc-rag eval --embedder titan --store ../data/ops/rag-index.json)" || st=$?
          { echo "## EV-04 (Titan v2, hybrid)"; echo '```json'; echo "$line"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$st"
      - name: print recorded fixtures (the sandbox cannot download artifacts)
        if: always() && inputs.task == 'record-fixtures'
        run: |
          for f in evals/m1_06/fixtures/${{ inputs.model }}/*.json; do
            echo "FIXTURE-BEGIN $(basename "$f")"; base64 -w0 "$f"; echo; echo "FIXTURE-END"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && (inputs.task == 'record-fixtures' || inputs.task == 'live-eval')
        with:
          name: agent-eval-${{ inputs.model }}
          path: |
            evals/m1_06/fixtures/${{ inputs.model }}/
            data/ops/report.json
          retention-days: 14
